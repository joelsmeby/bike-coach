name: Desktop workbench

on:
  push:
    paths:
      - 'desktop/**'
      - 'analysis-engine.mjs'
      - 'analysis-engine.test.mjs'
      - 'analyzer.html'
      - 'scripts/check-analysis-parity.mjs'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'analysis-engine.mjs'
      - 'analysis-engine.test.mjs'
      - 'analyzer.html'
      - 'scripts/check-analysis-parity.mjs'
      - '.github/workflows/desktop.yml'

jobs:
  desktop-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r desktop/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: python -m unittest discover -s desktop/tests -v
      - run: node --test analysis-engine.test.mjs
      - run: node scripts/check-analysis-parity.mjs
