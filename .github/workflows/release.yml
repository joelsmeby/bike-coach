name: Packages and release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the checked packages as a candidate GitHub Release (main only)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          name: installation-packages
          path: release-assets
      - run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
